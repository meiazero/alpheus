[package]
name = "alpheus"
version = "0.1.1"
edition = "2024"
description = "Disk usage Waybar widget, terminal dashboard, and TUI that finds and safely removes regenerable files"
license = "MIT"
repository = "https://github.com/meiazero/alpheus"
keywords = ["disk", "tui", "waybar", "cleanup", "ncdu"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
libc = "0.2.191"
ratatui = "0.30.2"
serde_json = "1.0.154"

[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = true
